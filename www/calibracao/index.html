<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle de Calibração — Extreme Wind</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/gridjs.umd.js" integrity="sha384-/XXDzxe4FsGiAe50i/u9pY/Vy/uX654MHB1xoc1BJNnH1WXHhqHga9g3q5tF4gj7" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/theme/mermaid.min.css" integrity="sha384-jZvDSsmGB9oGGT/4l9bHXGoAv1OxvG/cFmSo0dZaSqmBgvQTKDBFAMftlXTmMbNW" crossorigin="anonymous">
<style>
  :root {
    color-scheme: light;
    --navy: #0e2a4a;
    --navy-light: #1c4a72;
    --steel: #5b7ca8;
    --bg: #eaf1fa;
    --card: #ffffff;
    --border: #d8e3f2;
    --text: #16233a;
    --muted: #5c6f8a;
    --amber: #b4770a;
    --amber-bg: #fdf1de;
    --green: #1c8a5a;
    --green-bg: #e7f6ee;
    --red: #c22c3b;
    --red-bg: #fbe8ea;
    --gray: #5a6472;
    --gray-bg: #edeff2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .topbar {
    background: linear-gradient(120deg, var(--navy) 0%, var(--navy-light) 100%);
    color: #fff;
    padding: 18px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo-chip {
    background: #ffffff;
    border-radius: 8px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  }
  .brand-text h1 { font-size: 19px; margin: 0 0 4px 0; font-weight: 600; }
  .brand-text .subtitle { font-size: 12.5px; color: #c3d3ea; }
  .topbar .meta { text-align: right; font-size: 12px; color: #cdd8ea; line-height: 1.5; }
  .container { padding: 24px 32px 48px; max-width: none; margin: 0; }

  .kpi-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 22px;
    box-shadow: 0 1px 3px rgba(20,40,80,0.06);
  }
  .kpi .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--navy); font-weight: 700; margin-bottom: 8px; }
  .kpi .value { font-size: 36px; font-weight: 700; line-height: 1; color: var(--navy); }
  .kpi.warn .value { color: var(--amber); }
  .kpi.risk .value { color: var(--red); }
  .kpi .sub { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1.3fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    box-shadow: 0 1px 3px rgba(20,40,80,0.06);
  }
  .panel h2 { font-size: 14px; margin: 0 0 14px 0; color: var(--navy); font-weight: 700; }
  .chart-wrap { position: relative; height: 270px; }

  .panel-dark {
    background: linear-gradient(160deg, #0e2a4a 0%, #123a5e 100%);
    border: 1px solid #0a2038;
  }
  .panel-dark h2 { color: #eaf3ff; }
  .panel-dark .chart-sub { color: #9fc0e0; font-size: 11.5px; margin: -10px 0 14px 0; }

  #grid-table { font-size: 12.5px; }
  .gridjs-th { background: #f3f7fc !important; color: var(--navy) !important; font-size: 11.5px !important; text-transform: uppercase; }
  .gridjs-search-input { border-radius: 6px !important; }
  .due-soon-pill {
    display: inline-block;
    background: var(--amber-bg);
    color: var(--amber);
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
  }

  .footnote {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 18px;
    line-height: 1.6;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .state-msg { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
  .state-msg.error { color: #c22c3b; }
  @media (max-width: 900px) {
    .grid-2 { grid-template-columns: 1fr; }
  }
</style>
</head>

    <div class="brand-text">
      <h1>Controle de Instrumentos de Medição</h1>
      <div class="subtitle">Calibração e vencimentos · snapshot estático (data.json)</div>
    </div>
  </div>
  <div class="meta" id="meta-box">Carregando dados…</div>
</div>

<div class="container" id="app">
  <div class="state-msg" id="loading-msg">Carregando data.json…</div>
</div>

<script>
function statusClass(status) {
  if (status === "OK") return "OK";
  if (status.indexOf("VENCE EM") === 0) return "VENCE";
  if (status.indexOf("VENCIDO") === 0) return "VENCIDO";
  return "SEM";
}

function render(rows, refDate) {
  const app = document.getElementById("app");
  const total = rows.length;
  const withDias = rows.map(r => ({ ...r, diasNum: parseInt(r.diasRaw, 10) }));
  const dueSoon = withDias.filter(r => !isNaN(r.diasNum) && r.diasNum >= 0 && r.diasNum <= 90).length;

  const counts = { OK: 0, VENCE: 0, VENCIDO: 0, SEM: 0 };
  rows.forEach(r => counts[statusClass(r.status)]++);

  const buckets = [
    { label: "Vencido", test: d => d <= 0 },
    { label: "0–30 dias", test: d => d > 0 && d <= 30 },
    { label: "31–90 dias", test: d => d > 30 && d <= 90 },
    { label: "91–180 dias", test: d => d > 90 && d <= 180 },
    { label: "181–365 dias", test: d => d > 180 && d <= 365 },
    { label: "> 365 dias", test: d => d > 365 }
  ];
  const numericDias = withDias.map(r => r.diasNum).filter(d => !isNaN(d));
  const bucketCounts = buckets.map(b => numericDias.filter(b.test).length);

  document.getElementById("meta-box").innerHTML =
    `Snapshot gerado em: <b>${refDate || "—"}</b><br>${total} instrumentos monitorados`;

  app.innerHTML = `
    <div class="kpi-row">
      <div class="kpi"><div class="label">Total de Instrumentos</div><div class="value">${total}</div><div class="sub">itens sob controle</div></div>
      <div class="kpi warn"><div class="label">Prazo de 0 a 90 dias</div><div class="value">${dueSoon}</div><div class="sub">precisam de atenção em breve</div></div>
      <div class="kpi risk"><div class="label">Vencido</div><div class="value">${counts.VENCIDO}</div><div class="sub">indisponível para uso</div></div>
    </div>

    <div class="grid-2">
      <div class="panel panel-dark">
        <h2>Distribuição por Status</h2>
        <div class="chart-sub">${total} instrumentos no total</div>
        <div class="chart-wrap"><canvas id="donut"></canvas></div>
      </div>
      <div class="panel panel-dark">
        <h2>Pipeline de Vencimento</h2>
        <div class="chart-sub">dias até a próxima calibração</div>
        <div class="chart-wrap"><canvas id="bars"></canvas></div>
      </div>
    </div>

    <div class="panel">
      <h2>Instrumentos — Datas de Calibração</h2>
      <div id="grid-table"></div>
    </div>

    <div class="footnote">
      Snapshot estático gerado a partir da planilha "Controle_Calibracao_Extreme_Wind_2026_FINAL.xlsx" (Dropbox → 3 - SUPRIMENTOS / 01 - ALMOXARIFADO / 04 - ETIQUETAS / ETIQUETAS CALIBRAÇÃO). Este painel NÃO se atualiza sozinho — para atualizar, gere um novo data.json (script generate_data.py) e faça commit no repositório. Veja o README.
    </div>
  `;

  const donutColors = ["#5b9bd5", "#2f6fa8", "#123a5e", "#9fc0e0"];
  const donutValues = [counts.OK, counts.VENCE, counts.VENCIDO, counts.SEM];
  const donutLabelsBase = ["OK", "Vence em 90 dias", "Vencido", "Sem dados"];
  const donutLabels = donutLabelsBase.map((l, i) => `${l}  (${donutValues[i]})`);

  const centerTextPlugin = {
    id: "centerText",
    afterDraw(chart) {
      const { ctx, chartArea } = chart;
      const cx = (chartArea.left + chartArea.right) / 2;
      const cy = (chartArea.top + chartArea.bottom) / 2;
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#ffffff";
      ctx.font = "700 26px Segoe UI, Arial, sans-serif";
      ctx.fillText(total, cx, cy - 10);
      ctx.fillStyle = "#9fc0e0";
      ctx.font = "600 11px Segoe UI, Arial, sans-serif";
      ctx.fillText("INSTRUMENTOS", cx, cy + 14);
      ctx.restore();
    }
  };

  new Chart(document.getElementById("donut"), {
    type: "doughnut",
    data: {
      labels: donutLabels,
      datasets: [{
        data: donutValues,
        backgroundColor: donutColors,
        borderColor: "#123a5e",
        borderWidth: 2,
        hoverOffset: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: "68%",
      plugins: {
        legend: {
          position: "bottom",
          labels: {
            color: "#eaf3ff",
            boxWidth: 12,
            boxHeight: 12,
            padding: 14,
            font: { size: 12.5, weight: "600" }
          }
        }
      }
    },
    plugins: [centerTextPlugin]
  });

  const barValueLabels = {
    id: "barValueLabels",
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      chart.data.datasets.forEach((dataset, di) => {
        const meta = chart.getDatasetMeta(di);
        meta.data.forEach((bar, i) => {
          const value = dataset.data[i];
          if (value === 0) return;
          ctx.save();
          ctx.fillStyle = "#eaf3ff";
          ctx.font = "700 13px Segoe UI, Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(value, bar.x, bar.y - 8);
          ctx.restore();
        });
      });
    }
  };

  new Chart(document.getElementById("bars"), {
    type: "bar",
    data: {
      labels: buckets.map(b => b.label),
      datasets: [{
        label: "Instrumentos",
        data: bucketCounts,
        backgroundColor: ["#123a5e", "#1c4a72", "#2f6fa8", "#5b9bd5", "#8fc1e8", "#c3ddf4"],
        borderRadius: 5,
        maxBarThickness: 46
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 18 } },
      plugins: { legend: { display: false } },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { precision: 0, color: "#cfe1f5", font: { size: 11.5, weight: "600" } },
          grid: { color: "rgba(255,255,255,0.10)" }
        },
        x: {
          ticks: { color: "#cfe1f5", font: { size: 11.5, weight: "600" } },
          grid: { display: false }
        }
      }
    },
    plugins: [barValueLabels]
  });

  new gridjs.Grid({
    columns: [
      { name: "Código" },
      { name: "Data Calibração" },
      { name: "Próxima Calibração" },
      {
        name: "Dias p/ Vencer",
        formatter: (cell) => {
          const d = parseInt(cell, 10);
          if (!isNaN(d) && d >= 0 && d <= 90) {
            return gridjs.html(`<span class="due-soon-pill">${cell}</span>`);
          }
          return cell;
        }
      }
    ],
    data: withDias.map(r => [r.codigo, r.dataCalibracao, r.proximaCalibracao, r.diasRaw]),
    search: true,
    sort: true,
    pagination: { limit: 20 },
    className: {
      table: "gridjs-table-custom"
    }
  }).render(document.getElementById("grid-table"));
}

function renderError(msg) {
  document.getElementById("app").innerHTML = `<div class="state-msg error">Não foi possível carregar os dados (data.json).<br>${msg}</div>`;
  document.getElementById("meta-box").innerHTML = "Erro ao carregar";
}

// Se o navegador abrir este arquivo direto (file://), fetch() de data.json
// falha por restrição de segurança do navegador (não é bug do dashboard).
// Nesse caso, caímos para os dados embutidos abaixo (gerados junto com o
// data.json). Quando hospedado via HTTP (GitHub Pages etc.), o fetch
// funciona normalmente e sempre pega a versão mais recente do data.json.
async function loadData() {
  try {
    const res = await fetch("./data.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status + " ao buscar data.json");
    return await res.json();
  } catch (e) {
    const el = document.getElementById("embedded-data");
    if (el && el.textContent.trim()) {
      try {
        return JSON.parse(el.textContent);
      } catch (parseErr) {
        console.error("Falha ao ler dados embutidos:", parseErr);
      }
    }
    throw e;
  }
}

async function load() {
  try {
    const data = await loadData();
    const rows = (data && data.rows) || [];
    if (!rows.length) throw new Error("Nenhuma linha de instrumento foi encontrada nos dados.");
    render(rows, data.generated_at);
  } catch (e) {
    console.error(e);
    renderError(String(e && e.message ? e.message : e));
  }
}

load();
</script>
