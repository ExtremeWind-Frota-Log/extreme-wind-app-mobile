name: Build Android APK

# Gera o .apk automaticamente sempre que voce enviar (push) alteracoes.
# O projeto Android e criado do zero a cada execucao (nao precisa subir a
# pasta android/ pro repositorio) -- tudo acontece nos servidores do GitHub.
# Ao final, baixe o "app-debug.apk" na aba "Actions" > (execucao mais recente) > Artifacts.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java (necessario pro Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Criar o projeto Android (se ainda nao existir)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi
      - name: Gerar icone e splash screen a partir de resources/
        run: npx @capacitor/assets generate --android

      - name: Habilitar third-party cookies no WebView (necessario pro embed do Google Maps)
        id: cookie_patch
        continue-on-error: true
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name MainActivity.java)
          echo "MainActivity encontrado em: $MAIN_ACTIVITY"
          python3 patches/apply_webview_cookie_patch.py "$MAIN_ACTIVITY"

      - name: Avisar se o patch de cookies falhou
        if: steps.cookie_patch.outcome == 'failure'
        run: |
          echo "::warning::Patch de third-party cookies (embed do Google Maps) falhou -- ver step anterior. O apk sera gerado normalmente, mas o Mapa de Clientes no dashboard de Equipes pode nao carregar dentro do app."

      - name: Dar permissao de execucao ao gradlew
        run: chmod +x android/gradlew
      
      - name: Compilar APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear o apk para "Extreme Wind.apk"
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/Extreme Wind.apk"

      - name: Publicar o APK como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: Extreme Wind
          path: "android/app/build/outputs/apk/debug/Extreme Wind.apk"
