name: Build Android APK

# Gera o .apk automaticamente sempre que voce enviar (push) alteracoes.
# O projeto Android e criado do zero a cada execucao (nao precisa subir a
# pasta android/ pro repositorio) -- tudo acontece nos servidores do GitHub.
# Ao final, baixe o "app-debug.apk" na aba "Actions" > (execucao mais recente) > Artifacts.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java (necessario pro Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Gerar screenshot atualizado do Mapa de Clientes (Google My Maps)
        # O embed <iframe> do My Maps funciona no navegador normal, mas o
        # Google recusa servir o iframe dentro do WebView do app Android
        # (net::ERR_BLOCKED_BY_RESPONSE) -- ja tentamos cookies de terceiros e
        # um User-Agent de Chrome comum, nenhum dos dois resolveu esse
        # bloqueio. A solucao estavel: capturar o mapa como imagem usando um
        # Chrome headless de verdade aqui no CI, a cada build, e exibir essa
        # imagem no app em vez do iframe ao vivo. continue-on-error porque se
        # isso falhar (ex: mudanca no Google Maps, rede instavel), o build do
        # apk nao deve travar -- o index.html mantem a imagem anterior/
        # placeholder nesse caso.
        id: map_screenshot
        continue-on-error: true
        run: |
          npm install puppeteer --no-save
          node patches/gerar_screenshot_mapa.js

      - name: Avisar se o screenshot do mapa falhou
        if: steps.map_screenshot.outcome == 'failure'
        run: |
          echo "::warning::Geracao do screenshot do Mapa de Clientes falhou -- ver step anterior. O apk sera gerado normalmente, mas a imagem do mapa em www/assets/mapa-clientes.png pode estar desatualizada ou ausente."

      - name: Criar o projeto Android (se ainda nao existir)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi
      - name: Gerar icone e splash screen a partir de resources/
        run: npx @capacitor/assets generate --android

      - name: Dar permissao de execucao ao gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear o apk para "Extreme Wind.apk"
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/Extreme Wind.apk"

      - name: Publicar o APK como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: Extreme Wind
          path: "android/app/build/outputs/apk/debug/Extreme Wind.apk"
